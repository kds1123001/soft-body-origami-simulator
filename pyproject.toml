[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "softorigami"
version = "0.2.0"
description = "Differentiable origami mechanics and trajectory optimization"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.1"]

[tool.setuptools]
packages = ["softorigami"]
